name: forge-dev-codegen

artifactStorePath: .forge/artifact-store.yaml

build:
  # The engine: forge-dev generates its MCP surface, go-build makes the
  # binary a generator: URI resolves to.
  - name: gen-cli-go-cobra
    src: ./cmd/cli-go-cobra
    engine: forge://forge-dev

  - name: cli-go-cobra
    src: ./cmd/cli-go-cobra
    dest: ./build/bin
    engine: forge://go-build

  - name: gen-cli-rust-clap
    src: ./cmd/cli-rust-clap
    engine: forge://forge-dev

  - name: cli-rust-clap
    src: ./cmd/cli-rust-clap
    dest: ./build/bin
    engine: forge://go-build

  - name: gen-cli-python-typer
    src: ./cmd/cli-python-typer
    engine: forge://forge-dev

  - name: cli-python-typer
    src: ./cmd/cli-python-typer
    dest: ./build/bin
    engine: forge://go-build

  - name: gen-cli-typescript-commander
    src: ./cmd/cli-typescript-commander
    engine: forge://forge-dev

  - name: cli-typescript-commander
    src: ./cmd/cli-typescript-commander
    dest: ./build/bin
    engine: forge://go-build

  - name: gen-rest-rust-axum
    src: ./cmd/rest-rust-axum
    engine: forge://forge-dev

  - name: rest-rust-axum
    src: ./cmd/rest-rust-axum
    dest: ./build/bin
    engine: forge://go-build

  - name: gen-rest-python-fastapi
    src: ./cmd/rest-python-fastapi
    engine: forge://forge-dev

  - name: rest-python-fastapi
    src: ./cmd/rest-python-fastapi
    dest: ./build/bin
    engine: forge://go-build

  - name: gen-rest-typescript-fastify
    src: ./cmd/rest-typescript-fastify
    engine: forge://forge-dev

  - name: rest-typescript-fastify
    src: ./cmd/rest-typescript-fastify
    dest: ./build/bin
    engine: forge://go-build

  - name: gen-logging-gen
    src: ./cmd/logging-gen
    engine: forge://forge-dev

  - name: logging-gen
    src: ./cmd/logging-gen
    dest: ./build/bin
    engine: forge://go-build

  - name: gen-telemetry-gen
    src: ./cmd/telemetry-gen
    engine: forge://forge-dev

  - name: telemetry-gen
    src: ./cmd/telemetry-gen
    dest: ./build/bin
    engine: forge://go-build

  - name: gen-resilience-gen
    src: ./cmd/resilience-gen
    engine: forge://forge-dev

  - name: resilience-gen
    src: ./cmd/resilience-gen
    dest: ./build/bin
    engine: forge://go-build

  - name: gen-delivery-gen
    src: ./cmd/delivery-gen
    engine: forge://forge-dev

  - name: delivery-gen
    src: ./cmd/delivery-gen
    dest: ./build/bin
    engine: forge://go-build

  # The proof: a cli whose dispatcher is emitted by cli-go-cobra over real MCP
  # through forge:// resolution, pinned by the unit stage against the built
  # binary. Same handlers file as the builtin cell: the swap is the point.
  - name: gen-demo-cli-go-cobra
    src: ./cmd/demo-cli-go-cobra
    engine: forge://forge-dev

  - name: demo-cli-go-cobra
    src: ./cmd/demo-cli-go-cobra
    dest: ./build/bin
    engine: forge://go-build

test:
  - name: lint
    runner: forge://go-lint

  - name: unit
    runner: forge://go-test

factory:
  module: github.com/alexandremahdhaoui/forge-dev-codegen
  goVersion: "1.26.5"
  manifest: committed
