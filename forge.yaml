    src: ./cmd/forge-lint
    engine: forge://forge-dev

  - name: forge-lint
    src: ./cmd/forge-lint
    dest: ./build/bin
    engine: forge://go-build

  - name: gen-generated-drift
    src: ./cmd/generated-drift
    engine: forge://forge-dev

  - name: generated-drift
    src: ./cmd/generated-drift
    dest: ./build/bin
    engine: forge://go-build

  - name: gen-demo-cli-go-cobra
    src: ./cmd/demo-cli-go-cobra
    engine: forge://forge-dev

  - name: demo-cli-go-cobra
    src: ./cmd/demo-cli-go-cobra
    dest: ./build/bin
    engine: forge://go-build

  - name: gen-demo-tui-rust
    src: ./demo/tui-rust/src/tui
    engine: forge://forge-dev

  - name: demo-tui-rust
    src: ./demo/tui-rust
    engine: forge://generic-builder
    spec:
      command: cargo
      args: ["build", "--manifest-path", "demo/tui-rust/Cargo.toml"]

  - name: gen-demo-authz-session
    src: ./demo/authz-gen/session
    engine: forge://forge-dev

  - name: gen-demo-authz-chat
    src: ./demo/authz-gen/chat
    engine: forge://forge-dev

  - name: gen-demo-authz-play
    src: ./demo/authz-gen/play
    engine: forge://forge-dev

  - name: gen-demo-authz-combined
    src: ./demo/authz-gen/combined
    engine: forge://forge-dev

  - name: gen-windows-allow
    src: ./cmd/windows-allow
    engine: forge://forge-dev

  - name: windows-allow
    src: ./cmd/windows-allow
    dest: ./build/bin
    engine: forge://go-build

test:
  - name: lint
    runner: forge://go-lint

  - name: unit
    runner: forge://go-test

  - name: demo-authz-fga
    runner: forge://generic-test-runner
    spec:
      command: fga
      args: ["model", "test", "--tests", "demo/authz-gen/combined/zz_generated_fga.yaml"]

  - name: demo-tui-rust
    runner: forge://generic-test-runner
    spec:
      command: cargo
      args: ["test", "--manifest-path", "demo/tui-rust/Cargo.toml"]

  - name: demo-tui-rust-lint
    runner: forge://generic-test-runner
    spec:
      command: cargo
      args: ["clippy", "--manifest-path", "demo/tui-rust/Cargo.toml", "--all-targets", "--", "-D", "warnings"]

  - name: generated
    runner: forge://github.com/alexandremahdhaoui/forge-dev-codegen/cmd/generated-drift
    spec: {}

factory:
  module: github.com/alexandremahdhaoui/forge-dev-codegen
  goVersion: "1.26.5"
  manifest: committed
