name: rest-rust-axum
kind: mcp-server
version: 0.1.0
description: Emits an axum server in rust for the rest-api kind - the paths are the surface, typed handlers per operation, LISTENING line on bind.
openapi:
  specPath: ./spec.openapi.yaml
generate:
  packageName: main
  docsBaseURL: https://raw.githubusercontent.com/alexandremahdhaoui/forge-dev-codegen/refs/heads/main
surface:
  tools:
    - name: generate
      description: Answer a axum server module from the normalized forge-dev model.
      input: GenerateInput
      output: GenerateOutput
