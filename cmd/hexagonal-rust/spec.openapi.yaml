openapi: 3.0.3
info:
  title: hexagonal-rust Spec Schema
  version: 0.1.0
components:
  schemas:
    Spec:
      type: object
      properties:
        note:
          type: string
          description: Unused. The engine has no configuration; the model it receives carries everything.
    GenerateInput:
      type: object
      description: The normalized model forge-dev hands every generator.
      properties:
        name:
          type: string
          description: The service name. The crate is named after it.
        version:
          type: string
          description: The service version.
        description:
          type: string
          description: The service description.
        kind:
          type: string
          description: What the program is. This engine fills the hexagonal kind only.
        language:
          type: string
          description: The cell's language. This engine emits rust only.
        packageName:
          type: string
          description: Unused here.
        layout:
          type: object
          additionalProperties: true
          description: The kind's layout. cells lists the module directories under src, one per transport cell.
        runtime:
          type: object
          additionalProperties: true
          description: The runnable inputs. Unused here.
        openapiSpec:
          type: string
          description: Unused. The rest cell reads the OpenAPI document, the skeleton reads the cell manifests.
        wiringSpec:
          type: string
          description: The wiring document. It names the binary, one candidate set per port and one enabled flag per driver.
        checksum:
          type: string
          description: The source checksum forge-dev computed.
        srcDir:
          type: string
          description: The crate root. Every emitted path is relative to it, and every listed cell is read under src.
      required:
        - name
        - kind
        - wiringSpec
    GeneratedFile:
      type: object
      properties:
        path:
          type: string
          description: The file path, relative to the engine source directory.
        content:
          type: string
          description: The file content.
      required:
        - path
        - content
    GenerateOutput:
      type: object
      properties:
        files:
          type: array
          description: The emitted files. forge-dev core writes them.
          items:
            $ref: "#/components/schemas/GeneratedFile"
      required:
        - files
