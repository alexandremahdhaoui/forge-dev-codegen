name: hexagonal-rust
kind: mcp-server
version: 0.1.0
description: Reads layout.cells, the wiring and the cell manifests of one service. Answers the crate root, the root layer modules, the config module, the config schema and main.
openapi:
  specPath: ./spec.openapi.yaml
generate:
  packageName: main
  docsBaseURL: https://raw.githubusercontent.com/alexandremahdhaoui/forge-dev-codegen/refs/heads/main
layout:
  tools:
    - name: generate
      description: Read layout.cells, the wiring and the cell manifests, and answer the crate root, the root layer modules, the config module, the config schema and main.
      input: GenerateInput
      output: GenerateOutput
