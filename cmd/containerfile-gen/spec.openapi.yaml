openapi: 3.0.3
info:
  title: containerfile-gen Spec Schema
  version: 0.1.0
components:
  schemas:
    Spec:
      type: object
      properties:
        note:
          type: string
          description: Unused. The engine has no configuration; the model it receives carries everything.
    GenerateInput:
      type: object
      description: The normalized model forge-dev hands every generator.
      properties:
        name:
          type: string
          description: The engine name. Env names derive from it.
        version:
          type: string
          description: The engine version.
        description:
          type: string
          description: The engine description.
        kind:
          type: string
          description: What the program is. This generator serves any kind; it only answers config.
        language:
          type: string
          description: The cell's language. Absent means go.
        packageName:
          type: string
          description: The package the emitted file belongs to. Absent means main.
        layout:
          type: object
          additionalProperties: true
          description: The kind's layout. Unused; the Spec schema decides the keys.
        runtime:
          type: object
          additionalProperties: true
          description: The runnable inputs. Unused here.
        openapiSpec:
          type: string
          description: The raw OpenAPI document. Its Spec schema is the source of truth for the keys.
        checksum:
          type: string
          description: The source checksum forge-dev computed.
        srcDir:
          type: string
          description: The engine source directory. Informational; paths answered are relative.
      required:
        - name
        - kind
        - openapiSpec
    GeneratedFile:
      type: object
      properties:
        path:
          type: string
          description: The file path, relative to the engine source directory.
        content:
          type: string
          description: The file content.
      required:
        - path
        - content
    GenerateOutput:
      type: object
      properties:
        files:
          type: array
          description: The emitted files. forge-dev core writes them.
          items:
            $ref: "#/components/schemas/GeneratedFile"
      required:
        - files
