openapi: 3.0.3
info:
  title: vectors-rust Spec Schema
  version: 0.1.0
components:
  schemas:
    Spec:
      type: object
      properties:
        note:
          type: string
          description: Unused. The engine has no configuration; the model it receives carries everything.
    GenerateInput:
      type: object
      description: The normalized model forge-dev hands every generator.
      properties:
        name:
          type: string
          description: The service name. It names the core and app crates, songe_<name>_core and songe_<name>_app style, that the generated tests import.
        version:
          type: string
          description: The service version. Unused here.
        description:
          type: string
          description: The service description. Unused here.
        kind:
          type: string
          description: What the program is. This engine fills the vectors kind only.
        language:
          type: string
          description: The cell's language. This engine emits rust only.
        packageName:
          type: string
          description: Unused here.
        runtime:
          type: object
          additionalProperties: true
          description: The runnable inputs. Unused here.
        openapiSpec:
          type: string
          description: The raw OpenAPI document. Its paths, x-controller, x-ports and schemas decide which controller trait and types each test imports and mocks.
        protoSpec:
          type: string
          description: The raw proto3 document of the datagram service. Absent means the vectors carry no datagram case. Its service block names every rpc a udp_<rpc> case may exercise.
        vectors:
          type: string
          description: The vectors document, inline. A JSON object with one "cases" array, each case naming an operationId, an input, either a controllerReply or an expectedErrorSubstring, an expectedStatus and an optional expectedBody. Absent means the engine reads the file that layout.vectors names.
        checksum:
          type: string
          description: The source checksum forge-dev computed. Unused here.
        srcDir:
          type: string
          description: The engine source directory. The path in layout.vectors resolves against it.
        layout:
          type: object
          additionalProperties: true
          description: The kind's layout. crateDir names the crate root relative to srcDir and defaults to srcDir itself, vectors names the vectors document relative to srcDir, cell names the udp module directory, which defaults to udp, and restCell names the rest module directory, which defaults to rest.
      required:
        - name
        - kind
        - openapiSpec
    GeneratedFile:
      type: object
      properties:
        path:
          type: string
          description: The file path, relative to the engine source directory.
        content:
          type: string
          description: The file content.
      required:
        - path
        - content
    GenerateOutput:
      type: object
      properties:
        files:
          type: array
          description: The emitted files. forge-dev core writes them.
          items:
            $ref: "#/components/schemas/GeneratedFile"
      required:
        - files
