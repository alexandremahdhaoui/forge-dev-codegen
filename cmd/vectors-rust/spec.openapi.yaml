openapi: 3.0.3
info:
  title: vectors-rust Spec Schema
  version: 0.1.0
components:
  schemas:
    Spec:
      type: object
      properties:
        note:
          type: string
          description: Unused. The engine has no configuration; the model it receives carries everything.
    GenerateInput:
      type: object
      description: The normalized model forge-dev hands every generator.
      properties:
        name:
          type: string
          description: The service name. It names the core and app crates, songe_<name>_core and songe_<name>_app style, that the generated tests import.
        kind:
          type: string
          description: What the program is. This engine fills the vectors kind only.
        language:
          type: string
          description: The cell's language. This engine emits rust only.
        openapiSpec:
          type: string
          description: The raw OpenAPI document. Its paths, x-controller, x-ports and schemas decide which controller trait and types each test imports and mocks.
        vectors:
          type: string
          description: The vectors document. A JSON object with one "cases" array, each case naming an operationId, an input, either a controllerReply or an expectedErrorSubstring, an expectedStatus and an optional expectedBody.
        surface:
          type: object
          additionalProperties: true
          description: The kind's surface. appDir may be given here instead of at the top level.
        appDir:
          type: string
          description: The root of the app crate, relative to the engine source directory. Absent means app.
      required:
        - name
        - kind
        - openapiSpec
        - vectors
    GeneratedFile:
      type: object
      properties:
        path:
          type: string
          description: The file path, relative to the engine source directory.
        content:
          type: string
          description: The file content.
      required:
        - path
        - content
    GenerateOutput:
      type: object
      properties:
        files:
          type: array
          description: The emitted files. forge-dev core writes them.
          items:
            $ref: "#/components/schemas/GeneratedFile"
      required:
        - files
