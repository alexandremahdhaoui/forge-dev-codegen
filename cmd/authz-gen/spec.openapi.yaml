openapi: 3.0.3
info:
  title: authz-gen Spec Schema
  version: 0.1.0
components:
  schemas:
    Spec:
      type: object
      properties:
        note:
          type: string
          description: Unused. The engine has no configuration. The model it receives carries everything.
    GenerateInput:
      type: object
      description: The normalized model forge-dev hands every generator.
      properties:
        name:
          type: string
          description: The cell name. It names the refusals.
        version:
          type: string
          description: The cell version. Unused here.
        description:
          type: string
          description: The cell description. Unused here.
        kind:
          type: string
          description: What the program is. This engine fills the authz kind only.
        language:
          type: string
          description: The cell's language. Unused here. The module is an OpenFGA document, not a program.
        packageName:
          type: string
          description: Unused here.
        layout:
          type: object
          additionalProperties: true
          description: The kind's layout. Unused here.
        runtime:
          type: object
          additionalProperties: true
          description: The runnable inputs. Unused here.
        wiringSpec:
          type: string
          description: The authz.yaml document, the text of the file wiring.specPath names. It carries the module name, the types with their relations, the conditions, the references, the extensions and the vectors.
        checksum:
          type: string
          description: The source checksum forge-dev computed. Unused here.
        srcDir:
          type: string
          description: The cell directory. Every emitted path is relative to it.
      required:
        - name
        - kind
        - wiringSpec
    GeneratedFile:
      type: object
      properties:
        path:
          type: string
          description: The file path, relative to the cell directory.
        content:
          type: string
          description: The file content.
      required:
        - path
        - content
    GenerateOutput:
      type: object
      properties:
        files:
          type: array
          description: The emitted files. forge-dev core writes them.
          items:
            $ref: "#/components/schemas/GeneratedFile"
      required:
        - files
