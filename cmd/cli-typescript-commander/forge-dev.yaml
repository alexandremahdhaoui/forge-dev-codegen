name: cli-typescript-commander
kind: mcp-server
version: 0.1.0
description: Emits commander dispatchers in typescript for the cli kind - the same behavior contract as every cli cell, a different library.
openapi:
  specPath: ./spec.openapi.yaml
generate:
  packageName: main
  docsBaseURL: https://raw.githubusercontent.com/alexandremahdhaoui/forge-dev-codegen/refs/heads/main
layout:
  tools:
    - name: generate
      description: Answer a typescript cli dispatcher from the normalized forge-dev model.
      input: GenerateInput
      output: GenerateOutput
